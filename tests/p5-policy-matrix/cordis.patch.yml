        policyId: fast
        serviceKey: financeReviewFast
        domainSuffix: _fast
        remote: false
    - id: finance-policy-matrix-strict
      name: '@local/dsh-financial-services/review'
      config:
        policyId: strict
        serviceKey: financeReviewStrict
        domainSuffix: _strict
